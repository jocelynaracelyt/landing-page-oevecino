
name: Deploy OeVecino

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos
        run: |
          mkdir -p _site
          cp -R assets css js pages _site/
          cp favicon.ico _site/ 2>/dev/null || true
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta http-equiv="refresh" content="0; url=pages/index.html">
            <title>OeVecino</title>
          </head>
          <body>
            <a href="pages/index.html">Ingresar a OeVecino</a>
          </body>
          </html>
          EOF

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar OeVecino
        id: deployment
        uses: actions/deploy-pages@v4
