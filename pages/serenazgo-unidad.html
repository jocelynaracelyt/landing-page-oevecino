<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de unidad · OeVecino</title>
  <meta name="description" content="Detalle de una unidad de Serenazgo: datos, tripulación e incidente asignado.">
  <link rel="icon" href="../favicon.ico" type="image/x-icon">


  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/main.js" defer></script>
</head>

<body data-page="serenazgo-unidad">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <div class="app-layout">
    <!-- Menú lateral (se genera en js/main.js según el rol) -->
    <aside class="sidebar" id="sidebar" aria-label="Menú principal"></aside>

    <div class="main-content">
      <!-- Barra superior (buscador, notificaciones y cuenta) -->
      <header class="topbar" id="topbar"></header>

      <div class="page">
        <main class="page-body" id="contenido">
          <div class="page-info">
            <nav class="breadcrumb" aria-label="Ruta de navegación"><ol><li><a href="serenazgo-unidades.html">Unidades de Serenazgo</a></li><li aria-current="page">Detalle de unidad</li></ol></nav>
            <p class="date-time" data-component="datetime"></p>
          </div>
          <div id="unit-detail" class="page-body">
            <div class="back-row">
              <a class="btn btn--text" href="serenazgo-unidades.html">← Volver a unidades</a>
              <span data-unit="status"></span>
            </div>

            <div class="page-title">
              <h1 data-unit="title">Unidad</h1>
              <p>Detalle de unidad · Central Norte</p>
            </div>

            <div class="two-columns">
              <div class="column" style="gap:24px">
                <section class="card" aria-labelledby="unit-data-title">
                  <h2 class="card-title" id="unit-data-title">Datos de la unidad</h2>
                  <div class="data-grid data-grid--two">
                    <div class="data-item"><span class="data-label">Código</span><span class="data-value data-value--large" data-unit="code"></span></div>
                    <div class="data-item"><span class="data-label">Placa</span><span class="data-value data-value--large" data-unit="plate"></span></div>
                    <div class="data-item"><span class="data-label">Tipo de unidad</span><span class="data-value data-value--large" data-unit="type"></span></div>
                    <div class="data-item"><span class="data-label">Central</span><span class="data-value data-value--large">Central Norte</span></div>
                  </div>
                </section>
                <section class="card" aria-labelledby="crew-title">
                  <h2 class="card-title" id="crew-title">Tripulación y turno</h2>
                  <div class="data-grid data-grid--two">
                    <div class="data-item"><span class="data-label" data-unit="leader-label">Jefe de unidad</span><span class="data-value data-value--large" data-unit="leader"></span></div>
                    <div class="data-item"><span class="data-label">Conductor</span><span class="data-value data-value--large" data-unit="driver"></span></div>
                    <div class="data-item data-item--full"><span class="data-label">Turno asignado</span><span class="data-value data-value--large" data-unit="shift"></span></div>
                    <div class="data-item data-item--full" data-unit="radio-item"><span class="data-label">Radio</span><span class="data-value data-value--large" data-unit="radio"></span></div>
                  </div>
                </section>
                <p class="note" data-unit="updated"></p>
              </div>

              <aside class="column" aria-labelledby="assigned-title">
                <h2 class="section-title" id="assigned-title">Incidente asignado</h2>
                <div class="stack-16" data-unit="incident"></div>
              </aside>
            </div>
          </div>
        </main>
        <footer class="site-footer" data-component="footer"></footer>
      </div>
    </div>
  </div>

</body>

</html>
